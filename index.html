<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎯 抓小球小游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部状态栏 -->
  <header id="status-bar">
    <div class="status-left">
      <span class="label">分数</span>
      <span id="score-value" class="value">0</span>
    </div>
    <div class="status-center">
      <span class="label">倒计时</span>
      <span id="timer-value" class="value timer-normal">02:00</span>
    </div>
    <div class="status-right">
      <button id="start-btn" class="game-btn">开始游戏</button>
    </div>
  </header>

  <!-- 游戏主区域 -->
  <main id="game-area">
    <!-- 小球独立容器（避免 innerHTML='' 误伤状态栏/弹窗） -->
    <div id="ball-layer"></div>

    <!-- 初始状态提示（仅游戏未开始时显示） -->
    <div id="hint-overlay" class="hint-overlay">
      <p>🎯 准备好抓小球了吗？</p>
      <p class="hint-sub">点蓝色小球 <b>+2分</b>，点空白 <b>-1分</b></p>
    </div>
  </main>

  <!-- 游戏结束弹窗 -->
  <div id="end-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>⏰ 时间到！</h2>
      <p class="final-score">最终分数</p>
      <p id="final-score-value" class="final-score-number">0</p>
      <button id="restart-btn" class="game-btn">重新开始</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
